  - rmt-foundations/airy-trace-class
- title: Factorially bounded coefficients give an entire Fredholm power series
  claims:
  - rmt-foundations/fredholm-entire
- title: The canonical real order-one Airy kernel series is monotone
  claims:
  - rmt-foundations/tw1-monotone
- title: Analytic moment-cumulant recursion at zero on the interior of the exponential integrability set
  claims:
  - rmt-foundations/moment-cumulant-recursion
- title: First resolvent identity for two invertible shifts of an arbitrary finite complex matrix
  claims:
  - rmt-foundations/first-resolvent-identity
- title: Signed real-parameter complex-valued Taylor integral remainder
  claims:
  - rmt-foundations/taylor-integral-remainder
- title: Scalar binomial repeated-edge walk-count majorant; does not count walks itself
  claims:
  - rmt-foundations/walk-defect-majorant
- title: Any two Airy ODE solutions with identical first-order initial data agree
  claims:
  - rmt-foundations/airy-abstract-uniqueness
