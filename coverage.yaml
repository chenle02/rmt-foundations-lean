schema: coverage/1
package: rmt-foundations
kind: library
summary: Kernel-checked foundations for random matrix theory (Airy function and kernel, Fredholm series,
  order-one Tracy-Widom monotonicity, moment-cumulant recursion, resolvent identity, Marchenko-Pastur
  law, Stieltjes transform and inversion, Herglotz-Borel representation, free-convolution subordination);
  16 main results compared.
