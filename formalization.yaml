version: v0.4
project:
  name: rmt-foundations
  description: 'Reusable random-matrix and analytic foundations: Tracy–Widom functions, Airy/Painlevé
    theory, GUE Hermite identities, concentration, and Stieltjes tools.'
  authors:
  - Le Chen
  license: Apache-2.0
sources:
- title: Tracy–Widom, Airy and random-matrix analytic foundations
  relationship: formalizes
  note: Known analytic results, with hypotheses stated explicitly; no mathematical novelty asserted.
related_formalizations:
- id: https://github.com/leanprover-community/mathlib4
  relationship: builds-on
  note: pinned in lake-manifest.json
status:
  scope: Abstract/concrete Airy, Fredholm and TW series, concentration, simple stochastic integration,
    Stieltjes inversion/Herglotz/subordination/MP, cumulants, resolvents, Taylor and scalar walk majorants.
    General local laws, universality, full Ito integration are excluded. RMTFoundations.TracyWidom CDF
    functions, Fredholm formulas, measures, uniqueness and interior quantiles. Canonical Painleve II response
    and relative Airy normalization; both integrable-tail formulas; global C1 CDFs with continuous positive
    densities, unique interior quantiles, actual operator factorization, sharp TW1/TW2 right-tail asymptotics
    and linear left bounds. Global classical Painleve II uniqueness under relative Airy normalization
    is proved; sharp cubic left asymptotics are excluded. Positive exponential absolute moments and all
    nonnegative real absolute moments for the actual TW1/TW2 measures; mean/variance integrals; TW96-scaled
    GSE determinant average with proved global C1 regularity, endpoints and interior levels; extended
    Airy kernel and one-time TW2 identity; finite Hermite Christoffel-Darboux/Vandermonde identities.
    GUE identification is conditional on GUELimit; the finite-N density is not proved to be the eigenvalue
    law of the matrix model. TW4 monotonicity/measure remain open. Multi-time Airy2 is a candidate only;
    convergence, operator realization and probability properties remain open. TW1 and TW2 density C1 regularity
    remains open; CDF C1 and density continuity/positivity are proved.
